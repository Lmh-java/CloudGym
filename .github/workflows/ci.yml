name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read

# Replace outdated PR runs; keep every push to main independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.14"
          python-version: "3.13"
          enable-cache: true

      - name: Install test dependencies
        # Test directly from the checkout; package-build checks are separate.
        run: uv sync --frozen --group dev --no-install-project

      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          bwrap --version

      - name: Install OPA
        env:
          OPA_VERSION: "1.19.0"
        run: |
          cd "$RUNNER_TEMP"
          base_url="https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}"
          curl --fail --location --retry 3 --output opa_linux_amd64_static "$base_url/opa_linux_amd64_static"
          curl --fail --location --retry 3 --output opa_linux_amd64_static.sha256 "$base_url/opa_linux_amd64_static.sha256"
          sha256sum --check opa_linux_amd64_static.sha256
          sudo install --mode=0755 opa_linux_amd64_static /usr/local/bin/opa
          opa version

      - name: Run test suite and case oracle fixtures
        # A private network namespace permits local fake servers but no external
        # connections, including from subprocesses. Tests still run as the runner user.
        run: |
          sudo unshare --net -- bash -euc '
            ip link set lo up
            exec runuser -u "$1" -- env AWS_EC2_METADATA_DISABLED=true PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 \
              PYTHONPATH="$3" \
              "$2" run --no-sync python -m pytest tests -q -ra
          ' -- "$(id -un)" "$(command -v uv)" "$PWD"

      - name: Preview smoke experiment
        run: uv run --no-sync python -m scripts.bench run experiments/smoke.yml --dry-run
