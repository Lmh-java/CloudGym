# Frozen research configuration; see docs/experiments.md for conditions and model access.
batch: paper-config-2
defaults:
  agent: claude
  timeout: 1800
  poll_interval: 10
  trials: 1
  distractors: true
  awareness: consult
cases_from: ../cases/aws
arms:
  - {name: haiku-4-5-sdk,         model: claude-haiku-4-5-20251001,   modality: sdk}
  - {name: haiku-4-5-iac,         model: claude-haiku-4-5-20251001,   modality: iac}
  - {name: haiku-4-5-cli,         model: claude-haiku-4-5-20251001,   modality: cli}
  - {name: opus-5-5-sdk,          model: claude-opus-5-5,             modality: sdk}
  - {name: opus-5-5-iac,          model: claude-opus-5-5,             modality: iac}
  - {name: opus-5-5-cli,          model: claude-opus-5-5,             modality: cli}
  - {name: fable-5-sdk,           model: claude-fable-5,              modality: sdk, order: 1}
  - {name: fable-5-iac,           model: claude-fable-5,              modality: iac, order: 1}
  - {name: fable-5-cli,           model: claude-fable-5,              modality: cli, order: 1}
  - {name: gpt-5-6-sol-sdk,       model: gpt-5.6-sol,                 agent: codex, modality: sdk}
  - {name: gpt-5-6-sol-iac,       model: gpt-5.6-sol,                 agent: codex, modality: iac}
  - {name: gpt-5-6-sol-cli,       model: gpt-5.6-sol,                 agent: codex, modality: cli}
  - {name: gpt-5-5-sdk,           model: gpt-5.5,                     agent: codex, modality: sdk}
  - {name: gpt-5-5-iac,           model: gpt-5.5,                     agent: codex, modality: iac}
  - {name: gpt-5-5-cli,           model: gpt-5.5,                     agent: codex, modality: cli}
